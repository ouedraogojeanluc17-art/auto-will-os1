<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>AUTO WILL OS</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="screen">

    <header class="topbar">
      <div class="brand">AUTO WILL <span>OS</span> <small>V2</small></div>
      <div class="controls">
        <button id="demoBtn" type="button">Démo : non</button>
        <div class="accents" id="accents" aria-label="Couleur d'ambiance"></div>
        <button id="themeBtn" type="button">Auto</button>
      </div>
    </header>

    <main class="main">

      <!-- Colonne gauche : heure + vitesse -->
      <section class="col">
        <div class="card clock">
          <div id="greeting">Bonjour</div>
          <div id="time">--:--</div>
          <div id="date"></div>
        </div>
        <div class="card speed">
          <div class="label">Vitesse</div>
          <div class="speed-row"><span id="speed">--</span><span class="unit">km/h</span></div>
          <div id="speedSrc" class="small">GPS en attente…</div>
        </div>
      </section>

      <!-- Colonne centrale : véhicule + température moteur -->
      <section class="col">
        <div class="card car">
          <svg id="carSvg" viewBox="0 0 200 400" aria-label="Véhicule vu du dessus">
            <rect class="body" x="50" y="20" width="100" height="360" rx="44"/>
            <rect id="d-hood" class="part" x="62" y="34" width="76" height="86" rx="18"/>
            <rect class="cabin" x="62" y="126" width="76" height="140" rx="12"/>
            <rect id="d-trunk" class="part" x="62" y="272" width="76" height="86" rx="18"/>
            <rect id="d-fl" class="door left"  x="36"  y="130" width="16" height="64" rx="5"/>
            <rect id="d-rl" class="door left"  x="36"  y="200" width="16" height="64" rx="5"/>
            <rect id="d-fr" class="door right" x="148" y="130" width="16" height="64" rx="5"/>
            <rect id="d-rr" class="door right" x="148" y="200" width="16" height="64" rx="5"/>
          </svg>
          <div id="doorStatus" class="status">Aucune donnée du véhicule</div>
        </div>
        <div class="card temp">
          <div class="temp-head">
            <span class="label">Température moteur</span>
            <span id="coolant" class="temp-val">-- °C</span>
          </div>
          <div class="gauge"><div id="gaugeFill"></div></div>
          <div id="tempWarn" class="small"></div>
        </div>
      </section>

      <!-- Colonne droite : musique -->
      <section class="col">
        <div class="card music">
          <div class="label">Musique</div>
          <div id="trackTitle" class="track">Aucune musique</div>
          <div id="trackArtist" class="small">Connecte ton téléphone en Bluetooth</div>
          <div class="player">
            <button type="button" data-cmd="previous" aria-label="Précédent">⏮</button>
            <button type="button" data-cmd="playpause" id="playBtn" aria-label="Lecture / pause">▶</button>
            <button type="button" data-cmd="next" aria-label="Suivant">⏭</button>
          </div>
          <div class="label">Playlist</div>
          <ol id="playlist" class="playlist"><li class="empty">Playlist vide</li></ol>
        </div>
      </section>

    </main>

    <nav class="dock" id="apps" aria-label="Applications"></nav>
    <div id="toast" role="status"></div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
