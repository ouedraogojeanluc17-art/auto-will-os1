name: Build APK AUTO WILL OS

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Creer le projet Android
        run: |
          set -e
          test -f index.html || { echo "index.html introuvable a la racine du depot"; exit 1; }
          A=android
          J=$A/app/src/main/java/com/autowillos/launcher
          mkdir -p $J $A/app/src/main/assets

          cat > $A/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'AutoWillOS'
          include ':app'
          EOF

          cat > $A/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > $A/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          EOF

          cat > $A/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.autowillos.launcher'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.autowillos.launcher'
                  minSdk 23
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.webkit:webkit:1.11.0'
          }
          EOF

          cat > $A/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />

              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
              <uses-feature android:name="android.hardware.location.gps" android:required="false" />

              <application
                  android:label="AUTO WILL OS"
                  android:hardwareAccelerated="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:screenOrientation="sensorLandscape"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout|uiMode|density">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > $J/MainActivity.java <<'EOF'
          package com.autowillos.launcher;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Context;
          import android.content.pm.PackageManager;
          import android.location.Location;
          import android.location.LocationListener;
          import android.location.LocationManager;
          import android.os.Bundle;
          import android.view.KeyEvent;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.GeolocationPermissions;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.webkit.WebViewAssetLoader;
          import java.util.Locale;

          public class MainActivity extends Activity implements LocationListener {

              private static final String START_URL = "https://appassets.androidplatform.net/assets/index.html";
              private static final int REQ_LOCATION = 1;

              private WebView web;
              private LocationManager locationManager;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);

                  web = new WebView(this);
                  setContentView(web);

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setGeolocationEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_COMPATIBILITY_MODE);
                  s.setCacheMode(WebSettings.LOAD_DEFAULT);

                  final WebViewAssetLoader loader = new WebViewAssetLoader.Builder()
                          .addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this))
                          .build();

                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                          return loader.shouldInterceptRequest(request.getUrl());
                      }

                      @Override
                      public void onPageFinished(WebView view, String url) {
                          view.evaluateJavascript("window.AUTOWILL_NATIVE=true;", null);
                      }
                  });

                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onGeolocationPermissionsShowPrompt(String origin, GeolocationPermissions.Callback callback) {
                          callback.invoke(origin, hasLocationPermission(), false);
                      }
                  });

                  web.loadUrl(START_URL);

                  locationManager = (LocationManager) getSystemService(Context.LOCATION_SERVICE);
                  if (hasLocationPermission()) {
                      startLocation();
                  } else {
                      requestPermissions(new String[]{Manifest.permission.ACCESS_FINE_LOCATION}, REQ_LOCATION);
                  }
              }

              private boolean hasLocationPermission() {
                  return checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) == PackageManager.PERMISSION_GRANTED;
              }

              @SuppressWarnings("MissingPermission")
              private void startLocation() {
                  try {
                      if (locationManager.isProviderEnabled(LocationManager.GPS_PROVIDER)) {
                          locationManager.requestLocationUpdates(LocationManager.GPS_PROVIDER, 1000, 0, this);
                      }
                  } catch (Exception ignored) {
                  }
              }

              @Override
              public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  if (requestCode == REQ_LOCATION && hasLocationPermission()) {
                      startLocation();
                  }
              }

              @Override
              public void onLocationChanged(Location loc) {
                  float kmh = loc.hasSpeed() ? loc.getSpeed() * 3.6f : 0f;
                  String js = String.format(Locale.US,
                          "window.dispatchEvent(new CustomEvent('autowill',{detail:{speed:%.1f,lat:%.6f,lng:%.6f}}));",
                          kmh, loc.getLatitude(), loc.getLongitude());
                  web.evaluateJavascript(js, null);
              }

              @Override
              public void onStatusChanged(String provider, int status, Bundle extras) {
              }

              @Override
              public void onProviderEnabled(String provider) {
                  if (hasLocationPermission()) {
                      startLocation();
                  }
              }

              @Override
              public void onProviderDisabled(String provider) {
              }

              @Override
              public boolean onKeyDown(int keyCode, KeyEvent event) {
                  if (keyCode == KeyEvent.KEYCODE_BACK) {
                      if (web.canGoBack()) {
                          web.goBack();
                      }
                      return true;
                  }
                  return super.onKeyDown(keyCode, event);
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) {
                      getWindow().getDecorView().setSystemUiVisibility(
                              View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                                      | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                                      | View.SYSTEM_UI_FLAG_FULLSCREEN
                                      | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                                      | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                                      | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN);
                  }
              }

              @Override
              protected void onDestroy() {
                  try {
                      locationManager.removeUpdates(this);
                  } catch (Exception ignored) {
                  }
                  super.onDestroy();
              }
          }
          EOF

          tar --exclude=./android --exclude=./.git --exclude=./.github --exclude='*.md' -cf - . | tar -xf - -C $A/app/src/main/assets
          echo "Fichiers embarques dans l'APK :"
          ls -R $A/app/src/main/assets | head -50

      - name: Compiler l'APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Renommer l'APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk AUTO-WILL-OS.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AUTO-WILL-OS-apk
          path: AUTO-WILL-OS.apk

      - name: Publier l'APK (lien de telechargement direct)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: AUTO WILL OS - dernier APK
          files: AUTO-WILL-OS.apk
          make_latest: true
